# Render Blueprint — deploys the whole app as a single Docker web service.
# See README for the click-through steps and required environment variables.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      # Set DATABASE_URL to a Postgres connection string (e.g. Neon free tier)
      # so documents persist across restarts. Falls back to ephemeral SQLite
      # if omitted.
      - key: DATABASE_URL
        sync: false
