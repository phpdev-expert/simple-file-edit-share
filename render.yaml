# Render Blueprint — provisions a free Postgres + the Docker web service and
# wires them together. In Render: New → Blueprint → pick this repo → Apply.
databases:
  - name: ajaia-docs-db
    plan: free
    databaseName: ajaia
    user: ajaia

services:
  - type: web
    name: ajaia-docs
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Auto-wired from the managed Postgres above (persists across restarts).
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
      # Strong JWT signing secret, generated once by Render.
      - key: SESSION_SECRET
        generateValue: true
      # HTTPS-only cookie in production.
      - key: COOKIE_SECURE
        value: "1"
      # Folder AI chat (OpenRouter). Set the key in the Render dashboard (secret);
      # leave unset to cleanly disable chat. Model has a sensible default.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o
